# SLAM Main Configuration File
# This file contains configuration parameters for the main SLAM application

# Data loading parameters
data:
  target_image_id: 10
  query_image_start_id: 20
  query_image_count: 5
  query_image_length: 5


# Debug and visualization options
debug:
  enable_debug: true
  save_intermediate: true
  output_dir: "../build/output"

# File paths
paths:
  # calibration_config: "../data/school/calibration_config.yaml"
  calibration_config: "../data/shadow/calibration_config.yaml"
  output_prefix: "slam_"
  
  # Data files
  gnss_file: "../data/shadow/gnss_data.txt"
  imu_file: "../data/shadow/bmi_imu_data.txt"
  odom_file: "../data/shadow/odom_data.txt"

# ESKF (Error-State Kalman Filter) Configuration
eskf:
  # Noise parameters (square root of power spectral density)
  noise:
    sigma_acc: 0.8                      # m/s²/√Hz (accelerometer noise)
    sigma_gyro: 0.02                   # rad/s/√Hz (gyroscope noise)
    sigma_ba: 0.0005                    # m/s²/√Hz (accelerometer bias random walk)
    sigma_bg: 0.0002                    # rad/s/√Hz (gyroscope bias random walk)
    sigma_wheel_vx: 0.1                # m/s (wheel forward speed noise)
    sigma_wheel_plane: 0.005            # m/s (wheel lateral/vertical constraint noise)
  
  # Physical constants
  gravity: 9.81                         # m/s²
  
  # Static initialization parameters
  init:
    min_samples: 200                    # minimum samples for static initialization (~2s at 100Hz)
    max_gyro: 0.05                      # rad/s (maximum gyro magnitude for static init)
    acc_std_thresh: 0.1                 # m/s² (maximum acceleration std for static init)
  
  # Zero-velocity update (ZUPT) parameters
  zupt:
    enable: false                        # enable zero-velocity updates
    max_gyro: 0.1                      # rad/s (maximum gyro magnitude for ZUPT)
    acc_norm_thresh: 0.15               # m/s² (maximum | |a| - g | for ZUPT)
    sigma_v: 0.01                       # m/s (velocity measurement noise for ZUPT)
  