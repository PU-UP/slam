# SLAM Main Configuration File
# This file contains configuration parameters for the main SLAM application

# Data loading parameters
data:
  target_image_id: 10
  query_image_start_id: 20
  query_image_count: 5
  query_image_length: 5


# Debug and visualization options
debug:
  enable_debug: true
  save_intermediate: true
  output_dir: "../build/output"

# File paths
paths:
  calibration_config: "../data/calibration_config.yaml"
  output_prefix: "slam_"