# SLAM Main Configuration File
# This file contains configuration parameters for the main SLAM application

# Data loading parameters
data:
  target_image_id: 10
  query_image_start_id: 20
  query_image_count: 5
  query_image_length: 5


# Debug and visualization options
debug:
  enable_debug: true
  save_intermediate: true
  output_dir: "../build/output"
  # DR specific debug options
  dr_debug: false                          # enable DR debug output

# File paths
paths:
  output_prefix: "slam_"  
  # 568_light
  calibration_config: "../data/568_light/calibration_config.yaml"
  gnss_file: "../data/568_light/gnss_data.txt"
  imu_file: "../data/568_light/bmi_imu_data.txt"
  odom_file: "../data/568_light/odom_data.txt"

  # school
  # calibration_config: "../data/school/calibration_config.yaml"
  # gnss_file: "../data/school/gnss_data.txt"
  # imu_file: "../data/school/bmi_imu_data.txt"
  # odom_file: "../data/school/odom_data.txt"

  # shadow
  # calibration_config: "../data/shadow/calibration_config.yaml"
  # gnss_file: "../data/shadow/gnss_data.txt"
  # imu_file: "../data/shadow/bmi_imu_data.txt"
  # odom_file: "../data/shadow/odom_data.txt"

  # No8
  # calibration_config: "../data/No8/calibration_config.yaml"
  # gnss_file: "../data/No8/gnss_data.txt"
  # imu_file: "../data/No8/bmi_imu_data.txt"
  # odom_file: "../data/No8/odom_data.txt"


# ESKF (Error-State Kalman Filter) Configuration
eskf:
  # Noise parameters (square root of power spectral density)
  noise:
    sigma_acc: 0.8                      # m/s²/√Hz (accelerometer noise)
    sigma_gyro: 0.001                   # rad/s/√Hz (gyroscope noise)
    sigma_ba: 0.0005                    # m/s²/√Hz (accelerometer bias random walk)
    sigma_bg: 0.0001                    # rad/s/√Hz (gyroscope bias random walk)
    sigma_wheel_vx: 0.01                # m/s (wheel forward speed noise)
    sigma_wheel_lateral: 0.05            # m/s (wheel lateral/vertical constraint noise)
    sigma_wheel_vertical: 0.05            # m/s (wheel lateral/vertical constraint noise)
  
  # Physical constants
  gravity: 9.81                         # m/s²
  
  # Static initialization parameters
  init:
    min_samples: 200                    # minimum samples for static initialization (~2s at 100Hz)
    max_gyro: 0.05                      # rad/s (maximum gyro magnitude for static init)
    acc_std_thresh: 0.1                 # m/s² (maximum acceleration std for static init)
  
  # Zero-velocity update (ZUPT) parameters
  zupt:
    enable: true                        # enable zero-velocity updates
    max_gyro: 0.1                      # rad/s (maximum gyro magnitude for ZUPT)
    acc_norm_thresh: 0.15               # m/s² (maximum | |a| - g | for ZUPT)
    sigma_v: 0.03                       # m/s (velocity measurement noise for ZUPT)

# DR (Dead Reckoning) Configuration
dr:
  # Mahony filter parameters
  mahony:
    kp: 1.0                             # proportional gain
    ki: 0.0001                          # integral gain
  
  # IMU processing parameters
  imu:
    static_gyro_threshold: 0.015        # rad/s (threshold for static detection)
    time_diff_warning: 0.1              # s (warning threshold for IMU time difference)
    time_diff_error: 1.0                # s (error threshold for IMU time difference)
    buffer_max_size: 400                # maximum IMU buffer size
  
  # Wheel processing parameters
  wheel:
    buffer_max_size: 100                # maximum wheel buffer size
    velocity_max: 0.8                   # m/s (maximum valid velocity)
    displacement_max: 0.4               # m (maximum valid displacement per step)
  
  # Bias estimation parameters
  bias:
    acc_bias_update_samples: 100        # samples for acc bias update
    gyro_bias_update_samples: 1000      # samples for gyro bias update
  